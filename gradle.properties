# AndroidX is required — this project uses only AndroidX libraries
# (Compose, Room, Navigation, Lifecycle). Without this flag AGP refuses
# to build.
android.useAndroidX=true

# We have no legacy support-library dependencies to migrate, so this can stay off.
android.enableJetifier=false

# Standard perf flags
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
kotlin.code.style=official
